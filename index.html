<style>
:root{--bg:#EEF2EE;--surface:#FFFFFF;--raised:#F5F8F5;--ink:#17201B;--muted:#56645C;--line:#D5DDD7;--herb:#2D6A46;--herb-ink:#FFFFFF;--herb-soft:#D6E8DC;--mustard:#B07C0C;--mustard-soft:#F5E8C6;--warn:#A63A24;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1512;--surface:#18201C;--raised:#1F2924;--ink:#E6EDE8;--muted:#9BA9A1;--line:#2C3832;--herb:#72C392;--herb-ink:#0F1512;--herb-soft:#24402F;--mustard:#E2B24A;--mustard-soft:#3A3120;--warn:#F08C74;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line)}
h1{font-size:1.55rem;letter-spacing:-.025em;margin:0;font-weight:700}
main{padding:12px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;padding:9px 2px 11px;color:var(--muted);font:inherit;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button[aria-current=page]{color:var(--herb);font-weight:700}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.sec h2{font-size:1.05rem;margin:0 0 8px;letter-spacing:-.01em}
.sec h3{font-size:.95rem;margin:12px 0 4px}
.muted{color:var(--muted)}.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
button.btn{font:inherit;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer}
button.btn.primary{background:var(--herb);color:var(--herb-ink);border-color:var(--herb);font-weight:600}
button.link{background:none;border:0;color:var(--herb);font:inherit;padding:0;cursor:pointer;text-align:left;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
select{padding:6px 8px;font-size:15px}
textarea{width:100%;min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--herb);outline-offset:2px}
.meal{display:grid;grid-template-columns:32px 1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.meal.first{border-top:0}
.meal select{grid-column:2/4;margin-top:4px;width:100%}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0;font-size:15px}
.tick.on{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.slotlbl{font-size:.78rem;color:var(--muted)}
.kc{font-variant-numeric:tabular-nums;text-align:right;font-size:.88rem;color:var(--muted)}
.plate{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--raised);border:1px solid var(--line);margin:10px 0 6px}
.plate span{height:100%;border-right:2px solid var(--surface)}
.seg-plan{background:var(--herb-soft)}.seg-ate{background:var(--herb)}.seg-free{background:var(--mustard)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:40px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font:inherit;color:var(--ink);cursor:pointer}
.chip.on{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.free{background:var(--mustard-soft);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.9rem}
.datebar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;gap:8px}
.datebar .mid{text-align:center}
.datebar strong{font-size:1.1rem;display:block}
.iconbtn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.25rem;cursor:pointer}
.big{font-size:2.7rem;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{font-size:.85rem;color:var(--muted)}
.stat b{display:block;font-size:1.2rem;color:var(--ink);font-variant-numeric:tabular-nums}
.shopitem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.shopitem.done .nm{text-decoration:line-through;color:var(--muted)}
.shopitem .nm{font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
.sheet .in{background:var(--surface);width:100%;max-width:640px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom))}
.sheet h2{font-size:1.35rem;letter-spacing:-.02em;margin:0 0 4px;line-height:1.2}
ol.steps{padding-left:1.3em;margin:6px 0}ol.steps li{margin-bottom:9px}
ul.ing{list-style:none;padding:0;margin:4px 0}ul.ing li{padding:6px 0;border-top:1px solid var(--line)}
details{margin-top:6px}details summary{cursor:pointer;font-weight:600;padding:4px 0}
.warn{color:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.field input,.field select{color:var(--ink);width:100%}
.pill{display:inline-block;font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--herb-soft);color:var(--ink)}
.pill.y{background:var(--mustard-soft)}
.timer{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.daycard .meal{grid-template-columns:1fr auto}
.daycard .meal select{grid-column:1/3}
.rlist button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;gap:10px}
.rlist button:first-child{border-top:0}
.ifthen li{margin-bottom:8px}
.saved{font-size:.78rem;color:var(--muted)}
svg.chart text{fill:var(--muted);font-size:10px}
.hint{font-size:.82rem;color:var(--muted);margin:4px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* Web version: back the app's storage calls with this browser's localStorage. Data stays on this device. */
if(!window.storage){window.storage={
  async get(k){const v=localStorage.getItem(k);if(v===null)throw new Error('not found');return{key:k,value:v,shared:false};},
  async set(k,v){localStorage.setItem(k,v);return{key:k,value:v,shared:false};},
  async delete(k){localStorage.removeItem(k);return{key:k,deleted:true,shared:false};},
  async list(p=''){return{keys:Object.keys(localStorage).filter(k=>k.startsWith(p)),prefix:p,shared:false};}};}
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>

const DEFAULT_PREFS=`How meals are built: one protein, one starch, one vegetable, and one sauce, usually in a bowl. Lots of flavor.
Whole foods first: fresh and frozen produce, whole grains, Rummo protein pasta instead of whole wheat, real meat and fish, sauces made from yogurt, citrus, herbs, tahini, and nut butter.
Variety: no meal repeats within about 3 weeks. New vegetables and fruits are welcome.
Protein: chicken first, plus fish and shrimp. Willing to try other meats. Not a fan of ground beef; beef is good as stew or sliced steak.
Cooking for one: Sunday prep covers weekday lunches (Sunday through Friday) and grains. Weekend lunches and dinners are made the day of, mostly in 15–35 min. Every other Sunday there's a batch pot (stew, chili, or soup). A slow cooker is coming in a few weeks; the batch recipes include slow cooker versions.
Units: cups, tablespoons, and teaspoons. Meat by the pound or by the piece.
Sauces already at home: green hot sauce, Frank's, brown mustard, honey mustard, chipotle mayo, Primal Kitchen ketchup, Nando's, Primal Kitchen buffalo. New sauces only a few at a time.
Kept out: beans, cheese, eggs, dark-meat chicken, pork. Banana only in smoothies. Avocado only blended into a sauce.
Kitchen: sauté pan with lid, small pot, large pot, grill pan, microwave, small NutriBullet, toaster oven, oven.
Free meals: lunch every Wednesday. Dinner on Friday in odd weeks, Saturday in even weeks.`;

/* ---------- Date helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/86400000);
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DFULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtD=s=>{const d=pd(s);return DN[d.getDay()]+', '+MN[d.getMonth()]+' '+d.getDate()};
const fmtS=s=>{const d=pd(s);return MN[d.getMonth()]+' '+d.getDate()};
const monday=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const TODAY=ds(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- State & storage ---------- */
const KEY='cutplan-v5',OLDKEYS=['cutplan-v4','cutplan-v3','cutplan-v2','cutplan-v1'];
let S=JSON.parse(JSON.stringify(DEF));
let ui={tab:'today',date:TODAY,week:null,trip:null,recipe:null,scale:1,timerEnd:0,timerDone:false,showExport:false,showImport:false};
let storageOK=true,saveT=null;
function mergeIn(d){S={...JSON.parse(JSON.stringify(DEF)),...d,settings:{...DEF.settings,...(d.settings||{})}};buildBase();}
async function load(){
  try{let r=null;try{r=await window.storage.get(KEY,false);}catch(e){}
    if(r&&r.value){mergeIn(JSON.parse(r.value));}
    else{for(const k of OLDKEYS){let o=null;try{o=await window.storage.get(k,false);}catch(e){}
      if(o&&o.value){const d=JSON.parse(o.value);mergeIn({J:d.J||{},ifthen:d.ifthen||DEF.ifthen,have:d.have||DEF.have,shop:d.shop||{},settings:{why:(d.settings||{}).why||''}});break;}}}
  }catch(e){}
  if(S.prefs&&!/Rummo/.test(S.prefs))S.prefs+='\nPasta: Rummo protein pasta instead of whole wheat.';
  if(!Object.keys(BASE).length)buildBase();
  if(!window.storage)storageOK=false;setSaved();}
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{
  try{const r=await window.storage.set(KEY,JSON.stringify(S),false);storageOK=!!r;}catch(e){storageOK=false;}
  setSaved();},350);}
function setSaved(){document.getElementById('saved').textContent=storageOK?'Saved on this device':'Not saving: storage is blocked in this browser';}

/* ---------- Scheduler: builds the default plan so meals don't repeat for ~3 weeks ---------- */
let BASE={};
function weekNo(s){const n=diffDays(S.settings.start,s);return n<0?0:Math.floor(n/7)+1;}
function weekLetter(s){const n=weekNo(s);return n?String(n):'';}
function batchFor(s){const w=weekNo(s);return w?BATCHES[Math.floor((w-1)/2)%BATCHES.length]:null;}
function isTrip(s){const d=diffDays(S.settings.tripStart,s);return d>=0&&d%S.settings.tripEvery===0;}
function lateInTrip(s){const d=diffDays(S.settings.tripStart,s);if(d<0)return false;return ((d-1)%S.settings.tripEvery+S.settings.tripEvery)%S.settings.tripEvery>=7;}
function prepSunday(s){const d=pd(s);d.setDate(d.getDate()-d.getDay());return ds(d);}
function buildBase(){
  BASE={};const st=S.settings.start;const q={};Object.keys(POOL).forEach(k=>q[k]=[...POOL[k]]);const last={};
  const snap=S.rsnap||{},fromN=S.rFrom?diffDays(st,S.rFrom):Infinity;
  const pick=(k,n,gap,hard,soft)=>{const arr=q[k];
    for(let pass=0;pass<4;pass++){for(let i=0;i<arr.length;i++){const id=arr[i];const lu=last[id];
      const rated=n>=fromN&&snap[id]!==undefined;if(rated&&snap[id]<=2&&pass<3)continue;const g2=rated&&snap[id]>=4.5?Math.round(gap*0.7):gap;
      const gapOk=pass>=2||lu===undefined||n-lu>=g2;const hardOk=pass>=3||!hard||hard(id);const softOk=pass>=1||!soft||soft(id);
      if(gapOk&&hardOk&&softOk){arr.splice(i,1);arr.push(id);last[id]=n;return id;}}}
    return arr[0];};
  let prevL=null,prevD=null;
  for(let n=0;n<730;n++){const s=addDays(st,n),wd=pd(s).getDay(),w=Math.floor(n/7)+1,odd=w%2===1,bat=BATCHES[Math.floor((w-1)/2)%BATCHES.length];
    const p={b:'',l:'',s1:'',d:'',s2:''};
    if(wd===2||wd===4)p.b=pick('b',n,14);
    const lateD=lateInTrip(s),lateL=!isTrip(prepSunday(s));
    const tagOf=id=>R[id]&&R[id].tag;
    if((odd&&wd===2)||(!odd&&wd===3))p.d=bat;
    else if((odd&&wd===5)||(!odd&&wd===6))p.d='FREE';
    else p.d=pick('d',n,21,id=>tagOf(id)!==tagOf(prevD),id=>!(R[id].del&&lateD));
    if(wd===3)p.l='FREE';
    else if((odd&&wd===4)||(!odd&&wd===5))p.l=bat;
    else if(wd===6)p.l=pick('w',n,28,id=>tagOf(id)!==tagOf(p.d),id=>!(R[id].del&&lateD));
    else p.l=pick('l',n,18,id=>tagOf(id)!==tagOf(p.d)&&tagOf(id)!==tagOf(prevL),id=>!(R[id].del&&lateL));
    const sub=['b','l','d'].reduce((a,sl)=>a+slotNut(s,p[sl],sl).k,0);
    p.s1=pick('s',n,2);
    if(sub+R[p.s1].k<1660)p.s2=pick('s',n,2,id=>id!==p.s1);
    prevL=p.l;prevD=p.d;BASE[s]=p;}
}

/* ---------- Plan logic ---------- */
function basePlan(s){return BASE[s]||null;}
function lockOf(s){const k=prepSunday(s);return S.locks&&S.locks[k]?k:null;}
function livePlan(s){const b=basePlan(s);return b?{...b,...(S.plan[s]||{})}:null;}
function planFor(s){const k=lockOf(s);if(k&&S.locks[k].plan[s])return{...S.locks[k].plan[s]};return livePlan(s);}
function lockWeek(sun){S.locks=S.locks||{};const plan={};for(let n=0;n<7;n++){const d=addDays(sun,n),p=livePlan(d);if(p)plan[d]=p;}const tasks=prepTasks(sun)||[];S.locks[sun]={plan,tasks,at:new Date().toISOString()};}
function lockRange(k){return `${fmtS(k)} to ${fmtS(addDays(k,6))}`;}
const getJ=s=>S.J[s]||{};
function J(s){if(!S.J[s])S.J[s]={};const j=S.J[s];j.ate=j.ate||{};j.extras=j.extras||[];return j;}
function slotNut(s,id,sl){if(!id)return{k:0,p:0};
  if(id==='FREE'){const j=getJ(s);return sl==='l'?{k:+(j.freeLK||S.settings.freeLK),p:35}:{k:+(j.freeK||S.settings.freeK),p:40};}
  const r=R[id];return r?{k:r.k,p:r.p}:{k:0,p:0};}
function dayTotals(s){const p=planFor(s);let k=0,pr=0;if(!p)return{k,p:pr};SLOTS.forEach(([sl])=>{const n=slotNut(s,p[sl],sl);k+=n.k;pr+=n.p;});return{k,p:pr};}
function eatenTotals(s){const p=planFor(s),j=getJ(s);let k=0,pr=0;if(p)SLOTS.forEach(([sl])=>{if(j.ate&&j.ate[sl]){const n=slotNut(s,p[sl],sl);k+=n.k;pr+=n.p;}});(j.extras||[]).forEach(x=>{k+=+x.k||0;pr+=+x.p||0;});return{k,p:pr};}
function slotOptions(sl,cur){
  const grp=sl==='s1'||sl==='s2'?'s':sl;let o='';
  if(sl==='b')o+=`<option value=""${cur===''?' selected':''}>Skip: fasting until lunch</option>`;
  else if(sl!=='d'&&sl!=='l')o+=`<option value=""${cur===''?' selected':''}>None</option>`;
  Object.entries(R).forEach(([id,r])=>{if(r.slots.includes(grp)){const nm=(grp==='l'&&r.batch)?r.n+' (leftovers)':r.n;o+=`<option value="${id}"${cur===id?' selected':''}>${esc(nm)} (${r.k})</option>`;}});
  if(sl==='d'||sl==='l')o+=`<option value="FREE"${cur==='FREE'?' selected':''}>Free ${sl==='l'?'lunch':'dinner'}</option>`;
  return o;}
function recName(id,sl){if(!id)return sl==='b'?'Fasting until lunch':'None';if(id==='FREE')return sl==='l'?'Free lunch':'Free dinner';if(sl==='l'&&R[id].batch)return R[id].n+' (leftovers)';return R[id].n;}

/* ---------- Formatting ---------- */
function fq(q){const w=Math.floor(q+1e-9),f=q-w;const m=[[0.125,'⅛'],[0.25,'¼'],[0.333,'⅓'],[0.5,'½'],[0.667,'⅔'],[0.75,'¾']];
  if(f<0.03)return String(w||0);if(f>0.97)return String(w+1);let best=null;m.forEach(([v,t])=>{if(Math.abs(v-f)<0.03)best=t;});
  if(best)return(w?w+' ':'')+best;return String(Math.round(q*10)/10);}
function qty(c,q){switch(c.u){
  case'lb':return`${fq(q)} lb`;
  case'cup':return q<0.24?`${fq(q*16)} tbsp`:`${fq(q)} cup${q>1.01?'s':''}`;
  case'tbsp':return q<0.9?`${fq(q*3)} tsp`:(q>=16?`${fq(q/16)} cup${q>16.2?'s':''}`:`${fq(q)} tbsp`);
  case'tsp':{if(q>=3){const t=q/3;if(Math.abs(t*4-Math.round(t*4))<0.05)return`${fq(t)} tbsp`;if(q>=6)return`about ${fq(Math.round(t*2)/2)} tbsp`;}return`${fq(q)} tsp`;}
  case'clove':return`${fq(q)} clove${q>1.01?'s':''}`;
  case'scoop':return`${fq(q)} scoop${q>1.01?'s':''}`;
  case'can':return`${fq(q)} can${q>1.01?'s':''}`;
  case'sheet':return`${fq(q)} sheet${q>1.01?'s':''}`;
  case'piece':return`${fq(q)}`;
  default:return fq(q);}}
function ingText(id,q,ov,sc){const c=CAT[id];let t;
  if(ov&&sc===1)t=ov;else{q=q*sc;
    if(c.u==='ea')t=`${fq(q)} ${c.r}${q>1.01&&!/[,)]/.test(c.r)?'s':''}`;
    else if(c.u==='piece')t=`${fq(q)} ${q>1.01?c.pl:c.r}`;
    else if(c.u==='clove')t=`${qty(c,q)} garlic`;
    else t=`${qty(c,q)} ${c.r}`;}
  return t+(c.opt?' (optional)':'');}
function roundUp(c,q){if(c.u==='cup'||c.u==='lb'||c.u==='tbsp')return Math.ceil(q*4-0.05)/4;if(c.u==='tsp')return Math.ceil(q*2-0.05)/2;return Math.ceil(q-0.05);}

/* ---------- Shopping ---------- */
function trips(){const a=[];for(let i=0;i<60;i++)a.push(addDays(S.settings.tripStart,i*S.settings.tripEvery));return a;}
function defaultTrip(){const t=trips();for(let i=0;i<t.length;i++){if(addDays(t[i],S.settings.tripEvery)>=TODAY)return i;}return 0;}
function shopFor(t){const tot={};const add=(id,mult)=>R[id].ing.forEach(([k,q])=>{tot[k]=(tot[k]||0)+q*mult;});
  for(let i=1;i<=S.settings.tripEvery;i++){const s=addDays(t,i),p=planFor(s);if(!p)continue;
    SLOTS.forEach(([sl])=>{const id=p[sl];if(id&&id!=='FREE'&&!R[id].batch)add(id,1);});}
  for(let i=0;i<S.settings.tripEvery;i++){const s=addDays(t,i);if(pd(s).getDay()!==0)continue;const tasks=prepBatches(s);tasks.forEach(id=>add(id,R[id].batch));}
  return tot;}

/* ---------- Sunday prep & nightly thaw ---------- */
const GRAIN={rice:'Rice: rinse, then simmer with 1½× its volume of water, covered, 15 min (brown rice 40 min); rest 5 min.',quinoa:'Quinoa: rinse, simmer with 2× water, covered, 15 min.',farro:'Farro: boil in plenty of salted water like pasta, 25–30 min; drain.',orzo:'Orzo: boil in salted water 8 min; drain and toss with a few drops of oil.'};
function prepBatches(s){const out=[];for(let n=1;n<=6;n++){const d=addDays(s,n),p=planFor(d);if(!p)continue;
  ['l','d'].forEach(sl=>{const id=p[sl];if(id&&R[id]&&R[id].batch&&weekNo(d)%2===1&&!out.includes(id))out.push(id);});}return out;}
function prepTasks(s){
  if(pd(s).getDay()!==0)return null;
  if(S.locks&&S.locks[s]&&S.locks[s].tasks)return S.locks[s].tasks;
  const lunches=[];const grains={};const roast={},cut={};let chickenLb=0;const prots=[];const fridgeDays=[],freezeDays=[];
  for(let n=0;n<=6;n++){const d=addDays(s,n),p=planFor(d);if(!p)continue;const dn=DFULL[pd(d).getDay()];
    ['l','d'].forEach(sl=>{const id=p[sl];if(!id||id==='FREE'||!R[id])return;const r=R[id];
      if(sl==='l'&&r.prep&&n<=5){lunches.push([id,dn]);(n<=3?fridgeDays:freezeDays).push(dn);
        r.ing.forEach(([k,q])=>{if(k==='chicken')chickenLb+=q;});
        (r.roast||[]).forEach(([k,q])=>roast[k]=(roast[k]||0)+q);(r.cut||[]).forEach(([k,q])=>cut[k]=(cut[k]||0)+q);
        if(r.prot&&!prots.includes(r.prot))prots.push(r.prot);}
      if(r.sr)r.ing.forEach(([k,q])=>{if(GRAIN[k])grains[k]=(grains[k]||0)+q;});});}
  const t=[];
  if(isTrip(s))t.push(['portion','Shopping day: portion chicken, fish, and meat into labeled freezer bags (⅓ lb or ½ lb, as the recipes use).']);
  prepBatches(s).forEach(id=>t.push(['batch'+id,`Make the ${R[id].n} in the large pot (4 servings). Refrigerate 2 for this week and freeze 2 for next week.`]));
  const byRec={};lunches.forEach(([id,dn])=>{(byRec[id]=byRec[id]||[]).push(dn);});
  const chickRecs=Object.keys(byRec).filter(id=>R[id].mar);
  if(chickenLb>0){t.push(['chicken',`Roast ${fq(Math.round(chickenLb*4)/4)} lb chicken breast on one foil-lined sheet pan at 425°F for 18–22 min, to 165°F. Season each piece for its bowl: `+chickRecs.map(id=>`${R[id].n} (×${byRec[id].length}): ${R[id].mar}`).join('; ')+'.']);}
  prots.forEach((x,i)=>t.push(['prot'+i,x+'.']));
  const rl=Object.entries(roast).map(([k,q])=>ingText(k,roundUp(CAT[k],q),null,1));
  if(rl.length)t.push(['veg',`Vegetable tray (or two): roast ${rl.join(', ')} with a little olive oil and salt at 425°F until browned at the edges, 20–30 min.`]);
  const cl=Object.entries(cut).map(([k,q])=>ingText(k,roundUp(CAT[k],q),null,1));
  if(cl.length)t.push(['cut',`Wash and cut, then store in containers: ${cl.join(', ')}.`]);
  Object.entries(grains).forEach(([k,q])=>{const r=Math.ceil(q*4)/4;t.push(['grain'+k,`Cook ${fq(r)} cup${r>1?'s':''} dry ${k} for this week's bowls. ${GRAIN[k]}`]);});
  const jars=Object.entries(byRec).filter(([id])=>R[id].jar).map(([id,v])=>`${R[id].jar} ×${v.length}`);
  if(jars.length)t.push(['sauces',`Mix the lunch sauces in small jars: ${jars.join('; ')}. Amounts are in each recipe.`]);
  if(fridgeDays.length||freezeDays.length)t.push(['store',`Lunches in the fridge: ${fridgeDays.join(', ')||'none'}. In the freezer: ${freezeDays.join(', ')||'none'}. Cooked chicken keeps 3–4 days in the fridge, so later portions are frozen and the app reminds you to thaw them. Freeze extra grains in single portions.`]);
  return t;}
function thawList(s){
  const t=addDays(s,1),p=planFor(t),out=[];if(!p)return out;const wd=pd(t).getDay();
  ['l','d'].forEach(sl=>{const id=p[sl];if(!id||id==='FREE'||!R[id])return;const r=R[id];
    if(r.batch){if(weekNo(t)%2===0)out.push(`1 frozen portion of ${r.n} (${sl==='l'?'lunch':'dinner'})`);return;}
    if(sl==='l'&&r.prep){if(wd>=4)out.push(`Tomorrow's lunch portion: ${r.n}. Grains can go straight from the freezer to the microwave.`);return;}
    r.ing.forEach(([k,q,ov])=>{const c=CAT[k];if(c.f&&k!=='burger')out.push(ingText(k,q,ov,1)+(sl==='l'?' for lunch':' for dinner'));});});
  return out;}

/* ---------- Views ---------- */

  if(L)return `<div class="free" style="margin-top:10px"><b>Menu locked</b> for ${lockRange(sun)}. Swaps are off, and the prep checklist, shopping list, and thaw reminders stay exactly as they were when you locked. <button class="link small" data-act="unlock" data-date="${sun}">Unlock</button></div>`;
  return `<div style="margin-top:10px"><button class="btn primary" data-act="lock" data-date="${sun}">Lock in menu for ${lockRange(sun)}</button><p class="hint">Do this once you've finished your swaps, before you shop and prep. Locking freezes Sunday through Saturday so nothing shifts after you've cooked.</p></div>`;}

function rateRow(j,k,lbl,lo,hi){return`<div style="margin:8px 0"><div class="small">${lbl}</div><div class="chips" style="margin-top:4px">${[1,2,3,4,5].map(v=>`<button class="chip${+j[k]===v?' on':''}" data-act="rate" data-k="${k}" data-v="${v}" aria-label="${v}">${v}</button>`).join('')}</div><div class="row between hint" style="margin-top:2px"><span>1 = ${lo}</span><span>5 = ${hi}</span></div></div>`;}

  }
  h+=`<section class="sec"><h2>Check-ins</h2>

/* ---------- Analytics ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1));};
const f1=v=>v===null||isNaN(v)?'–':(Math.round(v*10)/10).toFixed(1);
const fint=v=>v===null||isNaN(v)?'–':Math.round(v).toLocaleString();

/* What was actually eaten on a day. Unlogged days fall back to the plan. Free meals count at your estimate. */
function eatenDay(ctx,s){const p=planFor(s);if(!p)return null;const j=ctx.J[s]||{},ate=j.ate||{};
  const logged=Object.values(ate).some(Boolean)||(j.extras||[]).length>0;
  let k=0,pr=0,skipped=0,over=0,ext=0,planned=0,plannedP=0;
  SLOTS.forEach(([sl])=>{const id=p[sl];if(!id)return;
    if(id==='FREE'){const b=sl==='l'?S.settings.freeLK:S.settings.freeK;const est=+(j[sl==='l'?'freeLK':'freeK']||b);planned+=b;plannedP+=sl==='l'?35:40;k+=est;pr+=sl==='l'?35:40;over+=est-b;return;}
    const r=R[id];planned+=r.k;plannedP+=r.p;if(ate[sl]){k+=r.k;pr+=r.p;}else skipped-=r.k;});
  (j.extras||[]).forEach(x=>{k+=+x.k||0;pr+=+x.p||0;ext+=+x.k||0;});
  return{logged,k:logged?k:planned,p:logged?pr:plannedP,planned,plannedP,skipped:logged?skipped:0,over:logged?over:0,ext:logged?ext:0};}

    j.sleep=Math.round(clamp(7+gauss(r)*0.9,4.5,9.5)*2)/2;
    SLOTS.forEach(([sl])=>{const id=p[sl];if(!id)return;
      if(id==='FREE'){j.ate[sl]=true;const b=sl==='l'?st.freeLK:st.freeK;j[sl==='l'?'freeLK':'freeK']=Math.round(b*(1.2+gauss(r)*0.2)/10)*10;return;}
      if(r()>(sl==='s2'?0.22:0.06)){j.ate[sl]=true;if(sl==='l'||sl==='d'||sl==='b')j.rt[sl]=clamp(Math.round(recMean[id]+gauss(r)*0.6),1,5);}});
    if(r()<(wd===5||wd===6||wd===0?0.6:0.22))j.extras.push({n:['Chips','Beer','Cookies','Trail mix','Ice cream','Pizza slice'][Math.floor(r()*6)],k:Math.round((150+r()*320)/10)*10,p:Math.round(r()*8)});
    const fasting=!p.b;j.hL=clamp(Math.round(2.3+(fasting?0.9:0)-0.045*(prevDinP-50)-0.4*(j.sleep-7)+gauss(r)*0.55),1,5);
    j.energy=clamp(Math.round(3.3+0.45*(j.sleep-7)+gauss(r)*0.6),1,5);
    j.hard=clamp(Math.round(2.3+(wd===5||wd===6?0.8:0)-0.3*(j.sleep-7)+gauss(r)*0.6),1,5);
    Jd[s]=j;prevDinP=p.d&&p.d!=='FREE'&&R[p.d]?R[p.d].p:40;
    const e=eatenDay({J:Jd},s).k;w-=(trueT-10*(st.startW-w)-e*1.1)/3500;
    if(n===13||n===27)wis.push({d:s,w:Math.round((w+gauss(r)*0.6)*10)/10});}
  DEMO={J:Jd,today,demo:true,weighins:wis};return DEMO;}

/* Dashboard 1: Monte Carlo energy-balance model, reweighted by any weigh-ins (importance sampling). */
function projection(ctx){const st=S.settings,start=st.start,H=300,nObs=clamp(diffDays(start,ctx.today)+1,0,H);
  const intake=[];let logged=0,obs=0;
  for(let n=0;n<H;n++){const s=addDays(start,n),e=eatenDay(ctx,s);if(!e){intake.push(st.kcal);continue;}
    if(n<nObs){intake.push(e.k);obs++;if(e.logged)logged++;}else intake.push(e.planned);}
  const N=500,r=rng(42),sims=[];
  for(let i=0;i<N;i++){const T0=st.maint+gauss(r)*st.maintSd,W0=st.startW+gauss(r)*1.5,b=0.08+gauss(r)*0.08;let w=W0;const tr=new Float32Array(H);
    for(let n=0;n<H;n++){const tdee=T0-10*(W0-w);w-=(tdee-intake[n]*(1+b))/3500;tr[n]=w;}
    sims.push({T0,b,tr,wt:1});}
  const wis=(ctx.weighins||[]).filter(x=>{const n=diffDays(start,x.d);return n>=0&&n<H;});
  if(wis.length){sims.forEach(sm=>{let ll=0;wis.forEach(x=>{const z=(x.w-sm.tr[diffDays(start,x.d)])/2;ll-=0.5*z*z;});sm.ll=ll;});
    const mx=Math.max(...sims.map(s=>s.ll));sims.forEach(s=>s.wt=Math.exp(s.ll-mx));}
  const tw=sims.reduce((a,s)=>a+s.wt,0);sims.forEach(s=>s.wt/=tw);const ess=1/sims.reduce((a,s)=>a+s.wt*s.wt,0);
  const wq=(vals,qs)=>{const idx=vals.map((_,i)=>i).sort((a,b)=>vals[a]-vals[b]);const out=[];let c=0,k=0;
    for(const i of idx){c+=sims[i].wt;while(k<qs.length&&c>=qs[k]){out[k]=vals[i];k++;}}while(k<qs.length)out[k++]=vals[idx[idx.length-1]];return out;};
  const band=[];for(let n=0;n<H;n++)band.push(wq(sims.map(s=>s.tr[n]),[0.1,0.5,0.9]));

  case'tab':ui.tab=d.v;window.scrollTo(0,0);break;
  case'dprev':ui.date=addDays(s,-1);break;case'dnext':ui.date=addDays(s,1);break;case'dtoday':ui.date=TODAY;break;
  case'ate':{const j=J(s);j.ate[d.slot]=!j.ate[d.slot];save();break;}
  case'openR':ui.recipe=d.id;ui.scale=R[d.id].batch||1;break;
  case'closeR':ui.recipe=null;break;
  case'scale':ui.scale=+d.v;break;
  case'addx':{const n=document.getElementById('xn').value.trim(),k=+document.getElementById('xk').value||0,p=+document.getElementById('xp').value||0;if(!n&&!k)return;J(s).extras.push({n:n||'Extra',k,p});save();break;}
  case'rmx':J(s).extras.splice(+d.i,1);save();break;
  case'rate':{const j=J(s);j[d.k]=+j[d.k]===+d.v?0:+d.v;save();break;}
  case'water':{const j=J(s);j.water=Math.max(0,Math.min(16,(j.water||0)+ +d.v));save();break;}
  case'prep':{const j=J(s);j.prep=j.prep||{};j.prep[d.k]=!j.prep[d.k];save();break;}
  case'timer':if(ui.timerEnd){ui.timerEnd=0;clearInterval(timerInt);timerInt=null;}else{ui.timerEnd=Date.now()+600000;ui.timerDone=false;timerInt=setInterval(tick,1000);}break;
  case'addif':{const v=document.getElementById('ifn').value.trim();if(!v)return;S.ifthen.push(v);save();break;}
  case'rmif':S.ifthen.splice(+d.i,1);save();break;
  case'wprev':ui.week=addDays(ui.week,-7);break;case'wnext':ui.week=addDays(ui.week,7);break;case'wthis':ui.week=TODAY<S.settings.start?monday(S.settings.start):monday(TODAY);break;
  case'resetday':delete S.plan[d.date];save();break;
  case'rrate':{const j=J(s);j.rt=j.rt||{};j.rt[d.slot]=+j.rt[d.slot]===+d.v?0:+d.v;save();break;}
  case'demo':ui.demo=!ui.demo;DEMO=null;window.scrollTo(0,0);break;
  case'addWeigh':{const dd=document.getElementById('wid').value,w=parseFloat(document.getElementById('wiw').value);if(!dd||isNaN(w))return;S.weighins=(S.weighins||[]).filter(x=>x.d!==dd).concat([{d:dd,w}]).sort((a,b)=>a.d<b.d?-1:1);save();break;}
  case'rmWeigh':S.weighins.splice(+d.i,1);save();break;
  case'applyR':{const RS=ratingStats({J:S.J,today:TODAY});S.rsnap={};Object.entries(RS).forEach(([id,o])=>{const m=mean(o.r);if(o.r.length>=2||m<=1)S.rsnap[id]=m;});S.rFrom=nextSundayAfter(TODAY);buildBase();save();break;}
  case'clearR':S.rsnap=null;S.rFrom=null;buildBase();save();break;
  case'lock':lockWeek(d.date);save();break;
  case'unlock':if(!confirm('Unlock this week? You can swap meals again, and the prep checklist and shopping list will recalculate. Anything you already cooked or bought stays the same.'))return;delete S.locks[d.date];save();break;
  case'tprev':ui.trip=Math.max(0,ui.trip-1);break;case'tnext':ui.trip=Math.min(39,ui.trip+1);break;
  case'shopchk':case'uncheck':case'exchk':case'exrm':case'exadd':{const t=trips()[ui.trip];const st=S.shop[t]||(S.shop[t]={c:{},x:[]});st.c=st.c||{};st.x=st.x||[];
    if(a==='shopchk')st.c[d.k]=!st.c[d.k];if(a==='uncheck'){st.c={};st.x.forEach(x=>x.c=false);}
    if(a==='exchk')st.x[+d.i].c=!st.x[+d.i].c;if(a==='exrm')st.x.splice(+d.i,1);
    if(a==='exadd'){const v=document.getElementById('exn').value.trim();if(!v)return;st.x.push({n:v,c:false});}
    save();break;}
  case'have':{S.have=S.have||{};if(S.have[d.k])delete S.have[d.k];else S.have[d.k]='some at home';save();break;}
  case'export':ui.showExport=!ui.showExport;ui.showImport=false;break;
  case'import':ui.showImport=!ui.showImport;ui.showExport=false;break;
  case'copy':{const t=document.getElementById('exp');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{el.textContent='Copied';}).catch(()=>{try{document.execCommand('copy');}catch(_){}el.textContent='Copied';});return;}
  case'doimport':{try{const v=JSON.parse(document.getElementById('imp').value);if(!v.settings)throw 0;if(!confirm('Replace all current data with this backup?'))return;mergeIn(v);ui.showImport=false;save();}catch(err){alert('That text is not a valid backup. Paste the full backup text and try again.');return;}break;}
  case'reset':if(!confirm('Erase all plans, check-ins, and shopping checks? This cannot be undone.'))return;S=JSON.parse(JSON.stringify(DEF));buildBase();save();break;
  default:return;}
  render();});
document.addEventListener('change',e=>{
  const el=e.target,s=ui.date;
  if(el.dataset.ch==='slot'&&lockOf(el.dataset.date)){render();return;}
  if(el.dataset.ch==='slot'){const dt=el.dataset.date,sl=el.dataset.slot,v=el.value,b=basePlan(dt);S.plan[dt]=S.plan[dt]||{};
    if(b&&b[sl]===v)delete S.plan[dt][sl];else S.plan[dt][sl]=v;if(!Object.keys(S.plan[dt]).length)delete S.plan[dt];save();render();return;}
  if(['sleep','freeK','freeLK'].includes(el.dataset.ch)){const v=parseFloat(el.value),j=J(s);if(isNaN(v))delete j[el.dataset.ch];else j[el.dataset.ch]=v;save();render();return;}
  if(el.dataset.set){const k=el.dataset.set;let v=el.value;if(el.type==='number'){v=parseFloat(v);if(isNaN(v))return;if(k==='tripEvery')v=Math.max(5,Math.min(35,Math.round(v)));}
    if(el.type==='date'&&!v)return;S.settings[k]=v;if(k==='tripStart'||k==='tripEvery')ui.trip=null;DEMO=null;if(['start','tripStart','tripEvery','kcal'].includes(k))buildBase();save();render();return;}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.in==='notes'){J(ui.date).notes=el.value;save();}
  if(el.dataset.in==='why'){S.settings.why=el.value;save();}
  if(el.dataset.in==='prefs'){S.prefs=el.value;save();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.recipe){ui.recipe=null;render();}});

load().then(render);
</script>
</body>
